<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>NexusTrade Security — Login &amp; OTP Verification</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/style.css"/>
  <style>
    body {
      background: #070a10;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      margin: 0;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: #101520;
      border: 1px solid #1e2840;
      border-radius: 12px;
      padding: 2.2rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }
    .auth-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .auth-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
    }
    .auth-sub {
      font-size: 0.78rem;
      color: #8a99ad;
      margin-top: 0.25rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 1.2rem;
    }
    .form-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #94a3b8;
    }
    .form-input {
      width: 100%;
      padding: 0.75rem 0.9rem;
      background: #070a10;
      border: 1px solid #283552;
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
      box-sizing: border-box;
      outline: none;
      transition: all 0.2s;
    }
    .form-input:focus {
      border-color: #4f6ef7;
      box-shadow: 0 0 0 3px rgba(79, 110, 247, 0.15);
    }
    .otp-input-group {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin: 1.5rem 0;
    }
    .otp-digit {
      width: 48px;
      height: 52px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.5rem;
      font-weight: 700;
      background: #070a10;
      border: 1px solid #283552;
      border-radius: 8px;
      color: #10d982;
      outline: none;
    }
    .otp-digit:focus {
      border-color: #10d982;
      box-shadow: 0 0 0 3px rgba(16, 217, 130, 0.2);
    }
    .btn-auth {
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, #4f6ef7, #3b82f6);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-auth:hover {
      background: linear-gradient(135deg, #6070f4, #2563eb);
      box-shadow: 0 4px 16px rgba(79, 110, 247, 0.35);
    }
    .btn-auth:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .auth-alert {
      padding: 0.75rem 0.9rem;
      border-radius: 6px;
      font-size: 0.75rem;
      margin-bottom: 1rem;
      display: none;
    }
    .auth-alert.error { background: rgba(244, 63, 94, 0.15); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.3); }
    .auth-alert.success { background: rgba(16, 217, 130, 0.15); color: #10d982; border: 1px solid rgba(16, 217, 130, 0.3); }
  </style>
</head>
<body>

  <div class="auth-card" id="stepLogin">
    <div class="auth-brand">
      <div style="width:34px; height:34px; background:linear-gradient(135deg, #6366f1, #06b6d4); border-radius:8px; display:flex; align-items:center; justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <div>
        <div class="auth-title">NexusTrade Security</div>
        <div class="auth-sub">Protected Algorithmic Trading OS</div>
      </div>
    </div>

    <div class="auth-alert error" id="loginAlert"></div>

    <form id="formLogin" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">User ID / Email</label>
        <input class="form-input" id="email" type="email" value="admin@nexustrade.in" required placeholder="Enter User ID or Email"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" id="password" type="password" value="Nexus@2026" required placeholder="••••••••••••"/>
      </div>
      <button class="btn-auth" id="btnLoginSubmit" type="submit">🔒 Secure Login</button>
    </form>
  </div>

  <!-- STEP 2: EMAIL OTP VERIFICATION CARD -->
  <div class="auth-card" id="stepOtp" style="display:none;">
    <div class="auth-brand">
      <div style="width:34px; height:34px; background:linear-gradient(135deg, #10d982, #059669); border-radius:8px; display:flex; align-items:center; justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <div>
        <div class="auth-title">Email 2FA Verification</div>
        <div class="auth-sub" id="otpSubText">Enter 6-digit OTP code sent to your email</div>
      </div>
    </div>

    <div class="auth-alert success" id="otpSuccessAlert" style="display:block;">
      ✉ Security OTP code sent! Check your inbox or server console.
    </div>
    <div class="auth-alert error" id="otpAlert"></div>

    <form id="formOtp" onsubmit="handleVerifyOtp(event)">
      <div class="form-group">
        <label class="form-label" style="text-align:center;">6-DIGIT VERIFICATION CODE</label>
        <input class="form-input" id="otpFullInput" type="text" maxlength="6" placeholder="123456" style="text-align:center; font-family:'JetBrains Mono'; font-size:1.5rem; letter-spacing:8px; color:#10d982; font-weight:700;" required autofocus/>
      </div>

      <button class="btn-auth" id="btnOtpSubmit" type="submit" style="background:linear-gradient(135deg, #10d982, #059669);">Verify &amp; Enter Terminal</button>
      <div style="text-align:center; margin-top:1rem;">
        <a href="#" onclick="location.reload()" style="color:#8a99ad; font-size:0.75rem; text-decoration:none;">← Back to Login</a>
      </div>
    </form>
  </div>

  <script>
    let userEmail = '';

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btnLoginSubmit');
      const alert = document.getElementById('loginAlert');
      alert.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Authenticating…';

      userEmail = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ email: userEmail, password })
        });
        const data = await res.json();

        if (data.status === 'SUCCESS') {
          document.getElementById('stepLogin').style.display = 'none';
          document.getElementById('stepOtp').style.display = 'block';
          document.getElementById('otpSubText').textContent = `Enter 6-digit OTP code sent to ${userEmail}`;
          document.getElementById('otpFullInput').focus();
        } else {
          alert.textContent = data.message || 'Authentication failed';
          alert.style.display = 'block';
        }
      } catch (err) {
        alert.textContent = 'Server connection error';
        alert.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = '🔒 Secure Login';
      }
    }

    async function handleVerifyOtp(e) {
      e.preventDefault();
      const btn = document.getElementById('btnOtpSubmit');
      const alert = document.getElementById('otpAlert');
      alert.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Verifying…';

      const otpCode = document.getElementById('otpFullInput').value.trim();

      try {
        const res = await fetch('/api/auth/verify-otp', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ email: userEmail, otp_code: otpCode })
        });
        const data = await res.json();

        if (data.status === 'SUCCESS') {
          window.location.href = '/';
        } else {
          alert.textContent = data.message || 'Invalid OTP code';
          alert.style.display = 'block';
        }
      } catch (err) {
        alert.textContent = 'Server connection error';
        alert.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Verify & Enter Terminal';
      }
    }
  </script>
</body>
</html>
